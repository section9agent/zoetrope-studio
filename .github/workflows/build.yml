name: Build Zoetrope Studio

on:
  push:
    branches: [main, master]
    tags:    ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:   # allow manual runs from the Actions tab

permissions:
  contents: write      # needed to upload release assets

jobs:

  # ── Windows (.exe) ──────────────────────────────────────────────────────────
  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 Pillow pyinstaller

      - name: Build Windows executable
        run: pyinstaller zoetrope_studio.spec --clean --noconfirm

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/ZoetropeStudio/
          if-no-files-found: error

  # ── macOS (.app) ────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 Pillow pyinstaller

      - name: Build macOS app
        run: pyinstaller zoetrope_studio.spec --clean --noconfirm

      - name: Zip .app bundle
        run: |
          cd dist
          zip -r ZoetropeStudio-mac.zip ZoetropeStudio.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/ZoetropeStudio-mac.zip
          if-no-files-found: error

  # ── Linux (folder) ──────────────────────────────────────────────────────────
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libgl1 libglib2.0-0 libdbus-1-3 \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 \
            libxkbcommon-x11-0 libxcb-shape0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 Pillow pyinstaller

      - name: Build Linux app
        run: pyinstaller zoetrope_studio.spec --clean --noconfirm

      - name: Zip Linux folder
        run: |
          cd dist
          zip -r ZoetropeStudio-linux.zip ZoetropeStudio/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: dist/ZoetropeStudio-linux.zip
          if-no-files-found: error

  # ── GitHub Release (only on version tags) ──────────────────────────────────
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all/

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-all/windows-exe/ZoetropeStudio.exe
            dist-all/macos-app/ZoetropeStudio-mac.zip
            dist-all/linux-app/ZoetropeStudio-linux.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
